<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f5f1e8">
  <meta name="description" content="距離の定義を変えると都市の形はどう変わるか。複数の距離尺度で都市空間を見比べる実験アプリ。">
  <title>Re:Scale（リスケール） | 距離で変わる都市の形</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <link rel="stylesheet" href="./css/style.css">
</head>
<body>
  <header class="site-header">
    <a class="brand" href="./">Re:Scale（リスケール） <span>RE-SCALE</span></a>
  </header>

  <main class="app-shell redesigned-shell">
    <aside class="control-panel field-panel">
      <section class="field-stage">
        <div id="reach-map" aria-label="到達可能な路線と駅の地図"></div>
        <svg id="field-map" viewBox="0 0 600 560" role="img" aria-labelledby="field-title field-desc">
          <title id="field-title">選択駅からの実効時間による到達範囲</title><desc id="field-desc">選択駅から出発した場合の実効時間による到達範囲を、実際の地理位置で示します。</desc>
          <defs>
            <filter id="field-shadow"><feDropShadow dx="0" dy="6" stdDeviation="7" flood-color="#174941" flood-opacity=".14"/></filter>
            <marker id="mds-arrowhead" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L7,3.5 L0,7 Z"></path></marker>
          </defs>
          <g id="field-zoom-layer"><rect width="600" height="560" fill="#eef1eb"></rect>
          <g id="field-rings"></g><g id="field-axis"></g><g id="field-routes"></g><g id="field-origin"></g></g>
        </svg>
        <div class="field-station-info" id="field-station-info" role="status" aria-live="polite">駅に触れると駅名と実効時間を表示します</div>
        <div class="mesh-info" id="mesh-info" hidden><span id="mesh-info-title">選択したデータ</span><br><a href="https://disaportal.gsi.go.jp/hazardmap/copyright/opendata.html" target="_blank" rel="noopener noreferrer">出典・凡例：ハザードマップポータルサイト</a></div>
        <div class="field-note"><span class="north-mark">N</span><span id="field-note-text">到達範囲を色で表示</span></div>
      </section>

    </aside>

    <section class="visual-panel map-panel" aria-label="主要路線と駅の通常地図">
      <div class="map-stage normal-map-stage">
        <div id="normal-map" role="img" aria-label="OpenStreetMap 上の主要鉄道路線図"></div>
        <div class="map-help map-help-top">基準駅を選択してください</div>
      </div>
    </section>
  </main>

  <section class="options-panel" aria-label="オプション">
    <div class="options-inner">
      <div class="options-heading">オプション</div>
      <section class="origin-option" aria-labelledby="origin-heading">
        <div class="field-header"><div><span class="section-label" id="origin-heading">基準駅</span><strong id="origin-name">東京駅</strong></div></div>
      </section>
      <section class="field-controls" aria-label="距離条件">
        <div class="mode-switch" role="group" aria-label="表示モード"><button class="mode-button is-active" data-display-mode="radial" type="button" aria-pressed="true">放射距離</button><button class="mode-button" data-display-mode="mds" type="button" aria-pressed="false">多次元尺度</button></div><span class="mode-help" id="mode-help">この駅から街を見る</span>
        <div class="service-switches"><label>列車カテゴリ<select id="service-type"><option value="local">普通</option><option value="rapid">快速系</option></select></label><label>運行日<select id="service-day"><option value="weekday">平日</option><option value="holiday">休日</option></select></label></div>
        <div class="control-title"><span>実効時間の上限</span><output id="distance-value">30分</output></div>
        <input id="distance-range" type="range" min="10" max="60" step="5" value="30" aria-label="実効時間の上限">
        <div class="range-labels"><span>近い</span><span>遠い</span></div>
        <div class="hazard-options" aria-label="災害・地形データ">
          <label class="check-row"><input class="hazard-toggle" data-hazard="flood" type="checkbox" disabled><span class="check-mark"></span><span><strong>浸水</strong><small>浸水域を経路時間へ反映</small></span></label>
          <label class="check-row"><input class="hazard-toggle" data-hazard="landslide" type="checkbox" disabled><span class="check-mark"></span><span><strong>土砂</strong><small>公開データを経路へ反映</small></span></label>
          <label class="check-row"><input class="hazard-toggle" data-hazard="stormSurge" type="checkbox" disabled><span class="check-mark"></span><span><strong>高潮</strong><small>公開データを経路へ反映</small></span></label>
          <label class="check-row"><input class="hazard-toggle" data-hazard="tsunami" type="checkbox" disabled><span class="check-mark"></span><span><strong>津波</strong><small>公開データを経路へ反映</small></span></label>
        </div>
        <div class="sensitivity-controls" aria-label="ハザード別の影響係数">
          <label>浸水 α <input class="hazard-weight" data-hazard-weight="flood" type="range" min="0" max="2" step="0.25" value="1"><output data-hazard-weight-output="flood">1.00</output></label>
          <label>土砂 α <input class="hazard-weight" data-hazard-weight="landslide" type="range" min="0" max="2" step="0.25" value="1"><output data-hazard-weight-output="landslide">1.00</output></label>
          <label>高潮 α <input class="hazard-weight" data-hazard-weight="stormSurge" type="range" min="0" max="2" step="0.25" value="1"><output data-hazard-weight-output="stormSurge">1.00</output></label>
          <label>津波 α <input class="hazard-weight" data-hazard-weight="tsunami" type="range" min="0" max="2" step="0.25" value="1"><output data-hazard-weight-output="tsunami">1.00</output></label>
        </div>
        <details class="advanced-settings"><summary>詳細設定</summary>
          <label>増加倍率の上限 C <input id="hazard-cap" type="range" min="0" max="8" step="0.5" value="4"><output id="hazard-cap-output">4.0</output></label>
          <label>乗換追加コスト <input id="transfer-extra" type="range" min="0" max="10" step="0.5" value="0"><output id="transfer-extra-output">0.0</output>分</label>
        </details>
      </section>
      <p class="status" id="status" role="status">駅データを読み込み中</p>
      <details id="mds-quality" hidden><summary>MDSの再現性</summary><p id="mds-quality-text"></p></details>
    </div>
  </section>

  <footer>
    <nav aria-label="アプリの案内"><a href="./">トップ</a><span>·</span><a href="./manual.html">使い方</a><span>·</span><a href="./mechanism.html">Re:Scaleの仕組み</a><span>·</span><a href="./data.html">利用データ</a><span>·</span><a href="./contact.html">お問い合わせ先</a></nav>
  </footer>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
  <script type="module" src="./js/app.js"></script>
</body>
</html>
